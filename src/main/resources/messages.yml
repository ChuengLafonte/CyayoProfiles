# ==============================================================================
#                           CyayoProfiles Messages
# ==============================================================================
# Mendukung format Adventure MiniMessage (<red>, <bold>, dll)
# dan legacy color code (&a, &b, &c, dll).
# Placeholder menggunakan format {placeholder} (juga mendukung %placeholder%).
# PENTING: Jika diisi "none" atau none, maka pesan/suara TIDAK akan dikirimkan.

prefix: "<gradient:#FF512F:#DD2476><bold>[CyayoProfiles]</bold></gradient> <gray>» "

# Access & Permissions
no_permission: "<red>You do not have permission to do this!"
player_only: "<red>This command can only be executed by a player!"
player_not_found: "<red>Player <yellow>{player} <red>was not found or is offline!"
no_profile_warning: "<red>You do not have a character profile yet! Please create one first."

# Profile Switching
profile_switched: "<green>Switched to Profile <yellow>Slot #{slot} <green>(<white>{class} <green>Lv.{level})!"
profile_switch_cooldown: "<red>Please wait <yellow>{seconds} <red>seconds before switching profiles again!"
profile_switch_already_active: "<yellow>You are already playing on Profile Slot #{slot}."
profile_switch_title:
  title: "<gold><bold>{class}</bold>"
  subtitle: "<gray>Profile Slot #{slot} (Level {level}) Loaded"
  sound: "ENTITY_PLAYER_LEVELUP:1.0:1.0"

# Security & Anti-Exploit
switch_blocked_combat: "<red>You cannot switch profiles while in combat! Wait <yellow>{seconds}s<red>."
switch_blocked_world: "<red>You are not allowed to switch profiles in this world!"
switch_blocked_state: "<red>You cannot switch profiles right now (flying, falling, dead, riding, or in liquid)!"
delete_cooldown: "<red>Please wait <yellow>{seconds} <red>seconds before deleting another profile!"

# Profile Creation
class_locked: "<red>You do not have permission to select <white>{class_display}<red>! {locked_hint}"
class_locked_sound: "ENTITY_VILLAGER_NO:1.0:1.0"
profile_created: "<green>Profile in <yellow>Slot #{slot} <green>with class <white>{class} <green>has been created!"
profile_create_title:
  title: "<gold><bold>PROFILE CREATED</bold>"
  subtitle: "<gray>Welcome, <white>{class} <gray>adventurer!"
  sound: "UI_TOAST_CHALLENGE_COMPLETE:1.0:1.0"

# Profile Deletion
profile_deleted: "<red>Profile in <yellow>Slot #{slot} <red>(<white>{class}<red>) has been permanently deleted."
profile_delete_active_error: "<red>You cannot delete the profile you are currently playing!"
profile_delete_sound: "BLOCK_ANVIL_DESTROY:1.0:1.0"

# MMOItems Weapon & Armor Restrictions
weapon_restricted_actionbar: "<red><bold>⚠ REQUIREMENT NOT MET</bold> <gray>Requires class: <yellow>{required}"
weapon_restricted_sound: "ENTITY_VILLAGER_NO:1.0:1.0"

level_restricted_actionbar: "<red><bold>⚠ LEVEL TOO LOW</bold> <gray>Requires <yellow>Class Level {required}"
level_restricted_sound: "ENTITY_VILLAGER_NO:1.0:1.0"

armor_restricted_actionbar: "<yellow><bold>⚠ WARNING</bold> <gray>Armor stats disabled. Requires: <white>{required}"
armor_restricted_sound: "none"

# Admin Command
admin_reload_success: "<green>All CyayoProfiles configurations reloaded successfully!"
admin_setspawn_success: "<green>New Profile Spawn set at your location (<yellow>{world}, {x}, {y}, {z}<green>)!"
admin_open_success: "<green>Opened the profile menu for <yellow>{player}<green>!"
admin_set_level_success: "<green>Set active profile level (<white>{class} <green>Slot #{slot}) of <yellow>{player} <green>to <gold>{level}<green>!"
admin_set_level_class_success: "<green>Set <white>{class} <green>(<yellow>Slot #{slot}<green>) level of <yellow>{player} <green>to <gold>{level}<green>!"
admin_profile_not_found_for_class: "<red>Player <yellow>{player} <red>does not have a profile or class matching '<white>{target}<red>'!"
admin_add_xp_success: "<green>Added <yellow>{xp} XP <green>to <white>{class} <green>(<yellow>Slot #{slot}<green>) of <yellow>{player}<green>!"
admin_delete_success: "<green>Deleted Profile Slot #{slot} for <yellow>{player}<green>!"
admin_help:
  - "<gold><bold>=== CyayoProfiles Admin Commands ===</bold>"
  - "<yellow>/cyayoprofiles reload <gray>- Reload all configs"
  - "<yellow>/cyayoprofiles open <player> <gray>- Open profile GUI for a player"
  - "<yellow>/cyayoprofiles setspawn <gray>- Set spawn location for new profiles"
  - "<yellow>/cyayoprofiles switch <player> <slot> <gray>- Force switch player profile"
  - "<yellow>/cyayoprofiles setlevel <player> [class|slot] <level> <gray>- Set class/profile level"
  - "<yellow>/cyayoprofiles addxp <player> [class|slot] <amount> <gray>- Give XP to class/profile"
  - "<yellow>/cyayoprofiles delete <player> <slot> <gray>- Delete player profile"
  - "<yellow>/cyayoprofiles info <player> <gray>- View player profile summary"

# Challenge Gamemodes
gamemode_max_reached: "<red>You can only select up to <yellow>{max} <red>challenge modes at once!"
gamemode_mode_selected_sound: "UI_BUTTON_CLICK:1.0:1.2"
ironman_pickup_blocked: "<red>Ironman Mode: <gray>You cannot pick up items dropped by other players!"
ironman_drop_others_blocked: "<red>Ironman Mode: <gray>Other players cannot pick up items dropped by an Ironman!"
ironman_command_blocked: "<red>Ironman Mode: <gray>Command <yellow>/{command} <gray>is disabled for Ironman accounts!"
ironman_player_interact_blocked: "<red>Ironman Mode: <gray>You cannot interact directly with other players!"
ironman_container_blocked: "<red>Ironman Mode: <gray>You can only open containers belonging to this Ironman profile!"
ironman_container_break_blocked: "<red>Ironman Mode: <gray>You cannot break containers owned by other players or profiles!"
ironman_container_protected: "<red>This container belongs to an <gray>Ironman <red>character and cannot be accessed or broken!"
ironman_entity_interact_blocked: "<red>Ironman Mode: <gray>You cannot access or take items from this entity!"
ironman_enderchest_title: "<dark_gray><bold>Ironman Vault (Slot #{slot})</bold>"
hardcore_life_lost: "<red>❤ You lost a life! <yellow>{lives}/{max_lives} <red>lives remaining in Hardcore mode."
hardcore_life_lost_sound: "ENTITY_WITHER_HURT:0.8:0.8"
hardcore_fallen_player: "<dark_red><bold>[FALLEN]</bold> <red>All lives on Hardcore Profile Slot #{slot} ({class}) have been lost! This character is now permanently locked."
hardcore_fallen_title: "<dark_red><bold>PROFILE FALLEN</bold>"
hardcore_fallen_subtitle: "<gray>{class} Lv.{level} has fallen forever"
hardcore_fallen_sound: "ENTITY_WITHER_DEATH:1.0:0.8"
hardcore_fallen_broadcast: "<dark_red>☠ <yellow>{player} <gray>has permanently fallen in <dark_red>Hardcore <gray>mode as <gold>{class} Lv.{level}<gray>!"
profile_fallen_locked: "<dark_red>Profile Slot #{slot} has <bold>FALLEN</bold> in Hardcore mode and can no longer be played! You can delete it from the profile menu."
hunted_pvp_unprovoked: "<red>Hunted Mode: <gray>You may only fight back against non-Hunted players after they attack you first!"
hunted_retaliate_unlocked: "<gold>⚔ Attacked by <yellow>{attacker}<gold>! Self-defense unlocked for <yellow>{seconds}s<gold>."
hunted_death_dropped: "<red>⚔ As a <gold>Hunted <red>player, some items from your inventory dropped upon PvP death!"
hunted_ironman_drops_destroyed: "<gray>⚔ Items from the <dark_gray>Ironman<gray>+<gold>Hunted <gray>victim were destroyed and cannot be looted!"
